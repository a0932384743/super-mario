<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>超級瑪利歐</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', monospace;
    }

    #game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100dvh;
    }

    /* ── 遊戲畫面區 ── */
    #canvas-wrap {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 3px solid #444;
      box-shadow: 0 0 24px rgba(92, 148, 252, 0.35);
      touch-action: none;
    }

    /* ── 桌機鍵盤提示 ── */
    #kb-hint {
      color: #888;
      font-size: 11px;
      text-align: center;
      padding: 5px 0 2px;
      flex-shrink: 0;
    }
    #kb-hint span { color: #fcd020; }

    /* ── 觸控控制器（觸控裝置才顯示） ── */
    #touch-ctrl {
      display: none;
      width: 100%;
      flex-shrink: 0;
      height: 128px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      align-items: center;
      padding: 10px 16px 14px;
      /* 關鍵：讓子元素自己處理 touch，不讓父元素攔截 */
      touch-action: none;
    }

    @media (pointer: coarse) {
      #kb-hint    { display: none; }
      #touch-ctrl { display: flex; }
    }

    @media (pointer: coarse) and (orientation: landscape) and (max-height: 480px) {
      #touch-ctrl { height: 88px; padding: 6px 20px 10px; }
    }

    /* ── 按鍵區佈局 ── */
    #dpad        { display: flex; gap: 8px; align-items: center; }
    #mid-btns    { flex: 1; display: flex; justify-content: center; align-items: center; }
    #action-btns { display: flex; gap: 12px; align-items: center; }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-label {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }

    /* ── 基礎按鈕 ── */
    .btn {
      border: none;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 方向鍵 */
    .btn-dir {
      width: 62px; height: 62px;
      border-radius: 14px;
      background: linear-gradient(145deg, #4a4a5a, #252530);
      box-shadow: 0 5px 0 #111, inset 0 1px 0 rgba(255,255,255,0.12);
      color: #ddd;
      font-size: 28px;
      transition: filter 0.05s, transform 0.05s;
    }

    /* START */
    .btn-start {
      width: 56px; height: 28px;
      border-radius: 14px;
      background: linear-gradient(145deg, #484858, #202028);
      box-shadow: 0 3px 0 #111;
      color: #aaa;
      font-size: 10px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* 跳躍 A（紅） */
    .btn-a {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #ff5555, #bb0000);
      box-shadow: 0 6px 0 #770000, inset 0 1px 0 rgba(255,255,255,0.25);
      color: #fff;
      font-size: 26px;
      font-family: Arial, sans-serif;
      transition: filter 0.05s, transform 0.05s;
    }

    /* 奔跑 B（黃） */
    .btn-b {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #ffdd44, #cc8800);
      box-shadow: 0 5px 0 #885500, inset 0 1px 0 rgba(255,255,255,0.3);
      color: #5a2800;
      font-size: 22px;
      font-family: Arial, sans-serif;
      transition: filter 0.05s, transform 0.05s;
    }

    /* 按下視覺回饋 */
    .btn.pressed {
      filter: brightness(1.4);
      transform: translateY(3px);
    }

    @media (pointer: coarse) and (orientation: landscape) and (max-height: 480px) {
      .btn-dir { width: 48px; height: 48px; font-size: 22px; }
      .btn-a   { width: 54px; height: 54px; font-size: 20px; }
      .btn-b   { width: 46px; height: 46px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="game-wrap">

    <div id="canvas-wrap">
      <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <div id="kb-hint">
      <span>← →</span> 移動 &nbsp;|&nbsp;
      <span>Z / 空白鍵</span> 跳躍 &nbsp;|&nbsp;
      <span>X</span> 奔跑 &nbsp;|&nbsp;
      <span>Enter</span> 開始/確認
    </div>

    <!--
      觸控控制器
      ★ data-key 屬性 — 用來識別每個按鈕對應的虛擬鍵
      ★ pointer-events: none 讓所有按鈕不自行處理事件
         改由 #touch-ctrl 的統一 Touch 監聽器管理
    -->
    <div id="touch-ctrl">

      <div id="dpad">
        <div class="btn-wrap">
          <button class="btn btn-dir" data-key="ArrowLeft" aria-label="向左">◀</button>
          <span class="btn-label">左移</span>
        </div>
        <div class="btn-wrap">
          <button class="btn btn-dir" data-key="ArrowRight" aria-label="向右">▶</button>
          <span class="btn-label">右移</span>
        </div>
      </div>

      <div id="mid-btns">
        <button class="btn btn-start" data-key="Enter" aria-label="開始">START</button>
      </div>

      <div id="action-btns">
        <div class="btn-wrap">
          <button class="btn btn-b" data-key="KeyX"  aria-label="奔跑">B</button>
          <span class="btn-label">奔跑</span>
        </div>
        <div class="btn-wrap">
          <button class="btn btn-a" data-key="Space" aria-label="跳躍">A</button>
          <span class="btn-label">跳躍</span>
        </div>
      </div>

    </div>
  </div>

  <script src="js/game.js"></script>
  <script>
    // ── Canvas 自動縮放，維持 800×480 比例 ──
    function fitCanvas() {
      const wrap   = document.getElementById('canvas-wrap');
      const canvas = document.getElementById('gameCanvas');
      const scale  = Math.min(wrap.clientWidth / 800, wrap.clientHeight / 480);
      canvas.style.width  = Math.floor(800 * scale) + 'px';
      canvas.style.height = Math.floor(480 * scale) + 'px';
    }
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
    fitCanvas();

    // ── 多指觸控核心：單一監聽器，每次 touch 事件都重新掃描所有手指位置 ──
    (function () {
      const ctrl = document.getElementById('touch-ctrl');
      if (!ctrl) return;

      // 目前「按住中」的 key 集合
      const held = new Set();

      /**
       * 由螢幕座標找出該位置對應的虛擬按鍵 (data-key)
       * 用 getBoundingClientRect 逐一比對，不依賴 pointer-events CSS
       */
      const btns = Array.from(ctrl.querySelectorAll('[data-key]'));
      function keyAt(clientX, clientY) {
        for (const btn of btns) {
          const r = btn.getBoundingClientRect();
          if (clientX >= r.left && clientX <= r.right &&
              clientY >= r.top  && clientY <= r.bottom) {
            return btn.dataset.key;
          }
        }
        return null;
      }

      /**
       * 根據目前所有 touch 點，同步按鍵狀態
       * touches — TouchList（e.touches，代表當前所有觸碰點）
       */
      function sync(touches) {
        // 收集這一瞬間所有手指壓到的 key
        const next = new Set();
        for (const t of touches) {
          const k = keyAt(t.clientX, t.clientY);
          if (k) next.add(k);
        }

        // 比對 held vs next：釋放已移開的，按下新觸碰的
        for (const k of held) {
          if (!next.has(k)) {
            window._mario?.input.touch(k, false);
            ctrl.querySelectorAll(`[data-key="${k}"]`)
                .forEach(b => b.classList.remove('pressed'));
          }
        }
        for (const k of next) {
          if (!held.has(k)) {
            window._mario?.input.touch(k, true);
            ctrl.querySelectorAll(`[data-key="${k}"]`)
                .forEach(b => b.classList.add('pressed'));
          }
        }

        held.clear();
        next.forEach(k => held.add(k));
      }

      function releaseAll() {
        for (const k of held) {
          window._mario?.input.touch(k, false);
          ctrl.querySelectorAll(`[data-key="${k}"]`)
              .forEach(b => b.classList.remove('pressed'));
        }
        held.clear();
      }

      // 所有 touch 事件集中在 #touch-ctrl 上，e.touches 永遠是完整的多指清單
      const opt = { passive: false };
      ctrl.addEventListener('touchstart',  e => { e.preventDefault(); sync(e.touches); }, opt);
      ctrl.addEventListener('touchmove',   e => { e.preventDefault(); sync(e.touches); }, opt);
      ctrl.addEventListener('touchend',    e => { e.preventDefault(); sync(e.touches); }, opt);
      ctrl.addEventListener('touchcancel', e => { e.preventDefault(); releaseAll(); },    opt);
    })();

    // 防止整頁拖曳
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
